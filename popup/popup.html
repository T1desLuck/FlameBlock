<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FlameBlock</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">

    <header class="head">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" class="logo">
        <span class="brand-name">FlameBlock</span>
      </div>
      <button id="pauseBtn" class="icon-btn" data-i18n-title="pause_all_title" data-i18n-aria-label="pause_all_title" title="Приостановить везде" aria-label="Приостановить везде">
        <svg viewBox="0 0 24 24" width="18" height="18"><path id="pauseIcon" fill="currentColor" d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
      </button>
    </header>

    <section class="hero neu-out">
      <div class="hero-site">
        <img id="siteFavicon" class="site-favicon" src="" alt="" hidden>
        <span id="hostname" class="hostname">—</span>
      </div>

      <div class="hero-status">
        <span id="statusDot" class="status-dot"></span>
        <span id="siteStatus" class="site-status" data-i18n="protection_on">Защита включена</span>
      </div>

      <label class="switch switch-lg">
        <input type="checkbox" id="siteToggle">
        <span class="slider"></span>
      </label>
    </section>

    <section class="stats-row">
      <div class="stat-card neu-out">
        <svg class="stat-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/></svg>
        <span id="pageCount" class="stat-num">0</span>
        <span class="stat-label" data-i18n="on_page">на странице</span>
      </div>
      <div class="stat-card neu-out">
        <svg class="stat-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5-1.8-.9L12 19.9 3.8 16.1 2 17zm0-5 1.8.9L12 14.9l8.2-4 1.8-.9-10-5-10 5z"/></svg>
        <span id="totalCount" class="stat-num">0</span>
        <span class="stat-label" data-i18n="total_blocked_label">всего заблокировано</span>
      </div>
    </section>

    <div id="iframeHeuristicRow" class="iframe-heuristic-row" hidden>
      <span class="iframe-heuristic-dot"></span>
      <span data-i18n="iframe_heuristic_caught">Эвристика iframe поймала:</span>
      <strong id="iframeHeuristicCount">0</strong>
    </div>

    <div class="quick-actions">
      <button id="reloadBtn" class="quick-btn" data-i18n-title="reload_page" title="Обновить страницу">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span data-i18n="reload_page">Обновить страницу</span>
      </button>
      <button id="reportBtn" class="quick-btn" data-i18n-title="report_issue_button" title="Сообщить о проблеме">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span data-i18n="report_issue_button">Сообщить о проблеме</span>
      </button>
    </div>

    <footer class="foot">
      <button id="settingsBtn" class="settings-btn neu-out">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L1.63 8.84a.5.5 0 0 0 .12.64L3.78 11.06c-.05.3-.08.62-.08.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
        <span data-i18n="extension_settings">Настройки расширения</span>
      </button>
    </footer>
  </div>

  <script src="../common.js"></script>
  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
